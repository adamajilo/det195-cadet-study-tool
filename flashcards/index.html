
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Det 195 Warrior Knowledge Trainer</title>

  <meta
    name="description"
    content="Flashcards, quizzes and recitation practice for AFROTC Detachment 195 Warrior Knowledge, Fall 2026."
  >

  <meta name="theme-color" content="#2b3a2c">

  <meta property="og:title" content="Det 195 Warrior Knowledge Trainer">
  <meta
    property="og:description"
    content="Flashcards, quizzes and recitation practice for AFROTC Detachment 195 Warrior Knowledge, Fall 2026."
  >
  <meta property="og:type" content="website">

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%232b3a2c'/%3E%3Cpath d='M50 20 80 76H20Z' fill='%23e6b422'/%3E%3C/svg%3E"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Public+Sans:wght@400;500;600;700&display=swap"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="shell">

    <aside class="rail" aria-label="Study navigation">

      <figure class="photo" id="photo"></figure>

      <header>
        <p class="unit">AFROTC Detachment 195, Fall 2026</p>
        <h1>Warrior Knowledge</h1>
        <div class="next" id="next"></div>
      </header>

      <nav class="tabs" role="tablist" aria-label="Study modes">
        <button
          class="tab"
          type="button"
          role="tab"
          data-mode="flash"
          aria-selected="true"
          aria-controls="view"
          id="t-flash"
        >
          Cards
        </button>

        <button
          class="tab"
          type="button"
          role="tab"
          data-mode="quiz"
          aria-selected="false"
          aria-controls="view"
          id="t-quiz"
        >
          Quiz
        </button>

        <button
          class="tab"
          type="button"
          role="tab"
          data-mode="recite"
          aria-selected="false"
          aria-controls="view"
          id="t-recite"
        >
          Recite
        </button>

        <button
          class="tab"
          type="button"
          role="tab"
          data-mode="sched"
          aria-selected="false"
          aria-controls="view"
          id="t-sched"
        >
          Calendar
        </button>
      </nav>

      <div class="filters" id="filters">

        <div class="row">
          <span class="lbl">Study set</span>

          <button class="chip preset" type="button" data-preset="next" id="p-next">
            Up next
          </button>

          <button class="chip preset" type="button" data-preset="mid" id="p-mid">
            Midterm, weeks 1 to 4
          </button>

          <button class="chip preset" type="button" data-preset="final" id="p-final">
            Final, everything
          </button>
        </div>

        <div class="row" id="weekChips">
          <span class="lbl">Pick weeks</span>
        </div>

        <div class="row">
          <span class="lbl">Options</span>

          <button
            class="chip"
            type="button"
            id="incZh"
            aria-pressed="true"
          >
            Chinese phrases
          </button>

          <button
            class="chip"
            type="button"
            id="incAc"
            aria-pressed="false"
          >
            Aircraft (FTP only)
          </button>

          <button
            class="chip"
            type="button"
            id="flip"
            aria-pressed="false"
          >
            Answer first
          </button>
        </div>

      </div>
    </aside>

    <main class="stage">
      <section
        class="panel"
        id="view"
        role="tabpanel"
        aria-labelledby="t-flash"
        tabindex="0"
      ></section>

      <p class="note">
        Built from the Det 195 Fall 2026 Warrior Knowledge study guide.
        Confirm anything that looks off against the guide itself.
      </p>
    </main>

  </div>

  <script src="songs.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
